<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFront MaxEdit</title>

    <!-- Injected by the server (or the desktop shell) before any module runs.
         assetUrl() reads these; without them every asset resolves to an
         unhashed same-origin path. -->
    <script>
      window.BOOTSTRAP_CONFIG = {
        assetManifest: <%- assetManifest %>,
        cdnBase: <%- cdnBase %>,
        gameEnv: <%- gameEnv %>,
      };
    </script>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1b1b;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <script type="module" src="/src/client/world/WorldClient.ts"></script>
  </body>
</html>
