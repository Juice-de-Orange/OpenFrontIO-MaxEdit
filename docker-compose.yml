# The world and its database.
#
# `docker compose up -d` gives a world on ws://localhost:3000/ws with a
# Postgres behind it. The client is not in here: it is served by Vite in
# development, and its /ws proxy already points at port 3000.
#
# TLS and a public hostname are deliberately absent — they belong to a host
# rather than to a checkout; docs/deploy/README.md says what a real deployment
# needs in front of this. The backup sidecar is *in* the stack (phase 12): a
# stack that carries its own backup moves with you.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openfront
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfront}
      POSTGRES_DB: openfront
    volumes:
      - world-db:/var/lib/postgresql/data
    healthcheck:
      # The world refuses to start without its database, so compose has to know
      # more than "the container is running".
      test: ["CMD-SHELL", "pg_isready -U openfront -d openfront"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      # Exposed so the integration tests and psql can reach it from the host.
      - "${POSTGRES_PORT:-5432}:5432"

  world:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Only the maps a world here might run on are built into the image.
        # Add one and rebuild; the server lists what it has if MAP_ID is not
        # among them.
        WORLD_MAPS: ${WORLD_MAPS:-europe}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openfront:${POSTGRES_PASSWORD:-openfront}@db:5432/openfront
      WORLD_ID: ${WORLD_ID:-world-0}
      MAP_ID: ${MAP_ID:-europe}
      PORT: 3000
      # Only ever set by a gate. A real world ticks every five seconds; see
      # the note on TICK_INTERVAL_MS in src/server/Main.ts.
      WORLD_TICK_MS: ${WORLD_TICK_MS:-}
      # The phase-10 gate's counter-proof: "blind" stewards. Refused by the
      # server unless WORLD_TICK_MS is set too.
      REGENT_BREAK: ${REGENT_BREAK:-}
      # Arms identity and opens the season (phase 11, decision 0019). Unset
      # for a workbench world; a deployment sets it to "open".
      WORLD_SEASON: ${WORLD_SEASON:-}
      # An operator's one-off: move every *unclaimed* nation's regent onto
      # the focus its ruler's archetype calls for (decision 0028). Idempotent
      # — it writes only where the focus differs, and never touches a nation
      # a player holds — so it is safe to leave set, and safe to forget.
      REGENT_FOCUS_RESEED: ${REGENT_FOCUS_RESEED:-}
    ports:
      - "3000:3000"
    # No restart policy on purpose: the phase-1 gate is to kill this container
    # and start it again by hand, and a restart policy would do it before
    # anyone could look.
    restart: "no"

  # Nightly pg_dump with a verification that hard-aborts, and rotation.
  # In the stack on purpose (phase 12's first trap): whatever backup the host
  # "already has" may not exist, and a backup nobody ever restored is a hope.
  # `docker compose run --rm backup --once` takes one on demand.
  backup:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: openfront
      PGPASSWORD: ${POSTGRES_PASSWORD:-openfront}
      PGDATABASE: openfront
      BACKUP_INTERVAL_S: ${BACKUP_INTERVAL_S:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - world-backups:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

volumes:
  world-db:
  world-backups:
